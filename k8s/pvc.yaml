apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blog-media-pvc
  namespace: blog
spec:
  accessModes:
    # ReadWriteMany: both API pods mount the uploads at once. The cluster's default
    # storage class must support RWX; a site overlay may patch the class.
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
