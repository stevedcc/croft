# Assumes the ingress controller is Traefik in kube-system (the K3s default). With another controller, patch the
# Traefik "from" item (/spec/ingress/0/from/1) from a site overlay; see kustomization.yaml and k8s/README.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: croft-api-ingress
  namespace: blog
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: croft
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    # WORKAROUND(W-081, Kubernetes): a from item means AND within the item; the Traefik entry stays one item
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: croft
              app.kubernetes.io/component: web
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
    # END WORKAROUND(W-081)
      ports:
        - port: 8080
