# A plain Ingress with a placeholder host, routing everything to the Web Service (the Web app
# calls the API in-cluster and proxies media to the browser). No ingress class and no TLS here:
# the cluster's defaults apply. A site overlay sets the real host and usually replaces this with
# its own routing (an API host, redirects, certificates).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-web
  namespace: blog
spec:
  rules:
    - host: blog.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog-web
                port:
                  number: 80
