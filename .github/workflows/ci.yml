# CI on every pull request to main, every push to main, and by hand (brief 15a, issue #9).
# Five jobs, each building what it needs: `build` is the Release build that keeps the repo
# warning-free; the test jobs build Debug, because the suites run --no-build against the Debug
# output that dev/run-e2e.sh also uses (AGENTS.md "Running things").
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore Croft.slnx
      - run: dotnet build Croft.slnx -c Release --no-restore -warnaserror

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet build Croft.slnx
      # Testcontainers (Postgres) uses the runner's Docker; nothing to configure.
      - run: dotnet test tests/Croft.Api.Tests --no-build --logger trx --results-directory TestResults/api
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-tests-trx
          path: TestResults/api
          if-no-files-found: ignore

  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet build Croft.slnx
      - run: dotnet test tests/Croft.Web.Tests --no-build --logger trx --results-directory TestResults/web
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-tests-trx
          path: TestResults/web
          if-no-files-found: ignore

  # The API suite's opt-in categories (AGENTS.md "Opt-in tests"): Container builds both
  # Dockerfiles and runs `migrate` in the images, ReadyToRun publishes both apps for linux-arm64
  # with the Dockerfiles' flags. On every run, no path filter (brief 15d): Renovate's digest-pin
  # PR #35 passed the other jobs and broke these tests on main.
  image-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet build Croft.slnx
      # Testcontainers builds the images with the runner's Docker; nothing to configure.
      - run: dotnet test tests/Croft.Api.Tests --no-build --filter "Category=Container|Category=ReadyToRun" --logger trx --results-directory TestResults/image
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-tests-trx
          path: TestResults/image
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # compose.yaml plus the CI override (see that file for why).
      COMPOSE_FILE: compose.yaml:.github/compose.ci.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Start Postgres and the mock IdP
        run: |
          # --wait: until postgres's healthcheck (.github/compose.ci.yaml) passes and oauth2 runs.
          docker compose up -d --wait --wait-timeout 180
          # The mock IdP image has no curl or wget for a healthcheck: poll its discovery document.
          for _ in $(seq 1 60); do
            curl -sf http://localhost:5556/default/.well-known/openid-configuration >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5556/default/.well-known/openid-configuration >/dev/null
      - run: dotnet tool restore
      - run: dotnet build Croft.slnx
      - name: Install Playwright browsers (chromium, firefox)
        run: node tests/Croft.Web.E2E/bin/Debug/net11.0/.playwright/package/cli.js install --with-deps chromium firefox
      # Two instances on the 4-vCPU runner; a plain run also does the DefaultBranding and
      # OutputCache passes.
      - run: dev/run-e2e.sh --instances 2
      - name: Compose state and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: |
            /tmp/blog-e2e-*.log
            /tmp/diag-*.png
            /tmp/diag-*.txt
            tests/Croft.Web.E2E/bin/Debug/net11.0/screenshots
            tests/Croft.Web.E2E/TestResults
          if-no-files-found: ignore
