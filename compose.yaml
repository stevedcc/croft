services:
  postgres:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    volumes:
      - blog-postgres-data:/var/lib/postgresql/data
    networks:
      - blog-network

  oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:2.3.0@sha256:dfcc1b60abe7414d2754767fceaec62a5dc79a10e543804069f69287b277e314
    ports:
      - "5556:8080"
    volumes:
      - ./dev/mock-oauth2-config.json:/app/config.json:ro,Z
      - ./dev/login.html:/app/login.html:ro,Z
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: "/app/config.json"
      LOG_LEVEL: "INFO"
    networks:
      - blog-network

volumes:
  blog-postgres-data:

networks:
  blog-network:
    driver: bridge
