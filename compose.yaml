services:
  postgres:
    # Fully qualified: Podman's enforcing short-name mode cannot ask which registry without a TTY,
    # so `docker compose up -d` from a script failed whenever the pinned digest had to be pulled.
    image: docker.io/library/postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18/docker and refuse to start
      # with a volume at /var/lib/postgresql/data (issue #34), so the volume is the parent folder.
      - blog-postgres-data:/var/lib/postgresql
    networks:
      - blog-network

  oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.3@sha256:2a813381bf282da46ff36ff386059e7903e25865056af8149f4fb3f1441916b8
    ports:
      - "5556:8080"
    volumes:
      - ./dev/mock-oauth2-config.json:/app/config.json:ro,Z
      - ./dev/login.html:/app/login.html:ro,Z
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: "/app/config.json"
      LOG_LEVEL: "INFO"
    networks:
      - blog-network

volumes:
  blog-postgres-data:

networks:
  blog-network:
    driver: bridge
