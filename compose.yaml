services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    volumes:
      - blog-postgres-data:/var/lib/postgresql/data
    networks:
      - blog-network

  oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "5556:8080"
    volumes:
      - ./dev/mock-oauth2-config.json:/app/config.json:ro,Z
      - ./dev/login.html:/app/login.html:ro,Z
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: "/app/config.json"
      LOG_LEVEL: "INFO"
    networks:
      - blog-network

volumes:
  blog-postgres-data:

networks:
  blog-network:
    driver: bridge
